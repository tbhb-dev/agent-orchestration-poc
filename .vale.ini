# Vale configuration. Styles come from vale-ai-tells (https://github.com/tbhb/vale-ai-tells), pinned by release URL.
# `mise run vale:sync` downloads them into .vale/styles, which is gitignored.
StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells-commits.zip

[formats]
COMMIT_EDITMSG = md

[*.md]
BasedOnStyles = ai-tells

[*.qmd]
BasedOnStyles = ai-tells

[.holding/**]
BasedOnStyles =

# research/imported/ holds verbatim copies of earlier research and is never linted.
[research/imported/**]
BasedOnStyles =

# research/gates/ holds raw worker notes that Codex turns into pages; the pages are linted, the notes are not.
[research/gates/**]
BasedOnStyles =

# Prose that predates this configuration and still carries ai-tells alerts (counts recorded in the PR for issue #3).
# Codex owns these files. Remove an entry once the file is clean so it is linted again.
[{PLAN.md,HANDOFF.md,FABLE_HANDOFF.md,.claude/agents/*.md,.claude/rules/go.md,design-sketch/*.md,experiments/00-system-assessment/*.md,reports/inputs/**,research/gates/go/*.md,docs/src/content/docs/guides/go-conventions.md,docs/src/content/docs/decisions/0001-go-linter.md}]
BasedOnStyles =

# The moved approved plan retains 105 alerts after one punctuation pass in issue #11.
[docs/src/content/docs/project/plan.md]
BasedOnStyles =

# The required decision title has a capitalized word after its record number.
[docs/src/content/docs/decisions/0002-python-type-checker.md]
BasedOnStyles = ai-tells
ai-tells.ColonUsage = NO

[{COMMIT_EDITMSG,**/COMMIT_EDITMSG}]
BasedOnStyles = ai-tells, ai-tells-commits
