[project]
name = "agent-orchestration-poc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Tony Burns", email = "tony@tonyburns.net" }]
dependencies = []

[project.scripts]
agent-orchestration-poc = "agent_orchestration_poc:main"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["research/imported", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
