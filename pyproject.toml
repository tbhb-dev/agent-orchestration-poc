[project]
name = "agent-orchestration-poc"
version = "0.1.0"
description = "Shared Python helper library for the agent orchestration experiment scripts"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Tony Burns", email = "tony@tonyburns.net" }]
dependencies = []

[dependency-groups]
dev = [
  "hypothesis==6.168.1",
  "import-linter==2.15",
  "mutmut==3.8.0",
  "pyrefly==1.3.1",
  "pytest>=9.1.1",
  "pytest-cov==7.0.0",
  "ruff>=0.16.9",
  "vulture==2.16",
]
analysis = [
  "duckdb==1.5.5",
  "ipykernel==7.1.0",
  "matplotlib==3.11.2",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.coverage.run]
branch = true
patch = ["subprocess"]

[tool.importlinter]
root_package = "agent_orchestration_poc"
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
id = "core-shell-layers"
name = "The shell imports the core; the core never imports the shell"
type = "layers"
layers = ["shell", "core"]
containers = ["agent_orchestration_poc"]

[[tool.importlinter.contracts]]
id = "core-no-io"
name = "The core does no I/O"
type = "forbidden"
source_modules = ["agent_orchestration_poc.core"]
forbidden_modules = [
  "asyncio",
  "multiprocessing",
  "nats",
  "os",
  "select",
  "selectors",
  "shutil",
  "signal",
  "socket",
  "subprocess",
  "sys",
  "threading",
  "websockets",
]
broken_contract_guidance = """
Core modules take values and return values. Move the call into agent_orchestration_poc.shell and pass its result in.
"""

[tool.mutmut]
source_paths = ["src/agent_orchestration_poc/core/"]
pytest_add_cli_args_test_selection = ["tests/"]

# Strict type checking for every Python file the repository tracks (research/gates/pyrefly/notes.md).
[tool.pyrefly]
# Everything except the verbatim research imports, the sketches, and gitignored trees (use-ignore-files
# defaults to true), so experiments/ and scripts/ join the check the day they gain a .py file.
project-excludes = ["research/imported", "design-sketch", ".holding"]
search-path = ["src"]
# pyrefly does not read requires-python; without this it takes the version from the queried interpreter.
python-version = "3.14"
# The strict preset plus the off-by-default kinds that make the helper package fully typed.
preset = "strict"
# Warn-by-default kinds (deprecated, redundant-cast, unreachable, untyped-import, ...) fail the check too.
min-severity = "warn"

[tool.pyrefly.errors]
unannotated-return = true
no-any-return = true
implicit-reexport = true
unused-type-ignore = true

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
filterwarnings = ["error"]
log_level = "INFO"
markers = [
  "integration: needs a spawned process or a running harness; skipped unless --run-integration",
  "socket: needs a Unix socket or WebSocket endpoint; skipped unless --run-integration",
  "slow: takes more than a few seconds; deselect with -m 'not slow'",
]
minversion = "9.1"
strict_config = true
strict_markers = true
strict_xfail = true
testpaths = ["tests"]

[tool.ruff]
line-length = 88
extend-exclude = [".worktrees", ".holding", "research/imported", "design-sketch", "*.md"]

[tool.ruff.lint]
extend-select = [
  "C901",  # McCabe complexity
  "I",  # isort
  "D",  # pydocstyle, scoped by the google convention below
  "ANN",  # flake8-annotations: the helper package is fully typed
  "S",  # flake8-bandit: the security category is off by default
  "T20",  # flake8-print: no print in the library, scripts exempted below
  "N",  # pep8-naming
  "PT",  # flake8-pytest-style
  "ARG",  # flake8-unused-arguments
  "ERA",  # eradicate: commented-out code
  "PTH",  # flake8-use-pathlib
  "PGH",  # pygrep-hooks: blanket noqa and type: ignore
  "INP",  # flake8-no-pep420: implicit namespace packages
  "A",  # flake8-builtins
  "LOG",  # flake8-logging
  "G",  # flake8-logging-format
  "RET",  # flake8-return
  "TC006",  # runtime-cast-value
  "RUF006",  # asyncio dangling task
  "ASYNC110",  # async busy wait
  "PLC0415",  # import outside top level
  "PLR0913",  # too many arguments
  "PLR0911",  # too many returns
  "PLR0912",  # too many branches
  "PLR0915",  # too many statements
  "PLR0917",  # too many positional arguments
  "B904",  # raise ... from inside except
  "TRY400",  # logging.exception inside handlers
]
ignore = [
  "S603",  # subprocess without shell: spawning processes is the point
  "S607",  # partial executable path: harness binaries resolve through PATH via mise
  "D105",  # docstrings on magic methods
  "D107",  # docstrings on __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D", "ARG", "INP001"]
"experiments/**" = ["T20", "INP001", "D"]
"scripts/**" = ["T20", "INP001"]

[tool.ruff.lint.isort]
known-first-party = ["agent_orchestration_poc"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-positional-args = 5
max-returns = 6
max-statements = 50

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.vulture]
paths = ["src", "tests", "experiments", "scripts"]
exclude = ["research/imported/", "node_modules/", ".holding/"]
min_confidence = 60
ignore_names = ["pytest_*"]
ignore_decorators = ["@pytest.fixture"]
