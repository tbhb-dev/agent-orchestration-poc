# rumdl configuration. Paragraphs are one line each (guard-markdown enforces it), so MD013 is off.
[global]
disable = ["MD013"]
exclude = ["research/imported/**", ".worktrees/", ".venv/", "node_modules/"]

[per-file-ignores]
# Subagent definitions open with a prompt paragraph, not a heading.
".claude/agents/*.md" = ["MD041"]
# Path-scoped rules files open with frontmatter and a prompt paragraph too.
".claude/rules/*.md" = ["MD041"]
# The clone table quotes each README's first line verbatim, so links and HTML in it are data.
"experiments/00-system-assessment/dependency-clones.md" = ["MD033", "MD042", "MD052", "MD057"]
# Two sections legitimately share the heading "What could not be found" under different parents.
"experiments/00-system-assessment/harness-research.md" = ["MD024"]
# Claude's root instructions begin with the cross-harness import.
"CLAUDE.md" = ["MD041"]
