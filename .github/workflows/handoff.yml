---
name: handoff

"on":
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  handoff:
    name: handoff
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-handoff-prs.sh
