---
# Runs the same `mise run check` aggregate workers run locally. The job is
# named `check` because the `main` ruleset requires it by name; keep the name.
name: check

"on":
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  RAPID_SEED: "20260926"
  RAPID_NOFAILFILE: "1"
  # mise's Rust backend drives rustup. Keeping the rustup and cargo homes under
  # the mise data directory puts them inside what jdx/mise-action caches, so a
  # cache hit restores a complete toolchain (jdx/mise-action#215).
  MISE_RUSTUP_HOME: /home/runner/.local/share/mise/rustup
  MISE_CARGO_HOME: /home/runner/.local/share/mise/cargo

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # check:secrets scans the whole history with gitleaks.
          fetch-depth: 0
      # v4.3.0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.8.6
          install: true
          cache: true
      - name: Capture pull request body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/gate-body.md"
      - run: mise run check
        env:
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GATE_BODY_FILE: >-
            ${{ github.event_name == 'pull_request' &&
                format('{0}/gate-body.md', runner.temp) || '' }}
