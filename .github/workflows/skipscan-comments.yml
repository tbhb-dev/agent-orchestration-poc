---
name: skipscan comments

"on":
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [skipscan]
    types: [completed]

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: write

jobs:
  rescan:
    if: >-
      ${{ (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null) ||
      github.event.workflow_run.event == 'pull_request_review' ||
      github.event.workflow_run.event == 'pull_request_review_comment' }}
    name: rescan skip indicators  # Refs: #300
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # v4.3.0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.8.6
          install: true
          cache: false
      - name: Scan current pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: mise run check:skipscan
