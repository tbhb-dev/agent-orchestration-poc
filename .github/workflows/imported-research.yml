---
# Imported copies are immutable. A `research(import)` PR may add paths and
# append lines to MANIFEST.md and MANIFEST.tsv without deleting existing lines.
# Other modifications, renames, and deletions fail.
# See scripts/check-imported-research.sh.
name: imported-research

"on":
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  imported-research:
    name: imported-research
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-imported-research.sh "$BASE_SHA" "$PR_TITLE"
