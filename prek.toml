# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json
#
# Every local hook runs its tool through mise, so the pinned version in mise.toml is the one
# that gates the commit. `prek install` writes both shims (see default_install_hook_types).

default_install_hook_types = ["pre-commit", "commit-msg"]
exclude = '^(research/imported/|\.worktrees/|\.venv/|node_modules/)'

[[repos]]
repo = "local"

[[repos.hooks]]
id = "trailing-whitespace"
name = "trim trailing whitespace"
language = "system"
entry = "mise exec -- scripts/record-check.sh hook:trailing-whitespace -- __builtin__ trailing-whitespace"
types = ["text"]
stages = ["pre-commit", "pre-push", "manual"]

[[repos.hooks]]
id = "end-of-file-fixer"
name = "fix end of files"
language = "system"
entry = "mise exec -- scripts/record-check.sh hook:end-of-file-fixer -- __builtin__ end-of-file-fixer"
types = ["text"]
stages = ["pre-commit", "pre-push", "manual"]

[[repos.hooks]]
id = "check-added-large-files"
name = "check for added large files"
language = "system"
entry = "mise exec -- scripts/record-check.sh hook:check-added-large-files -- __builtin__ check-added-large-files"
stages = ["pre-commit", "pre-push", "manual"]

[[repos.hooks]]
id = "gitleaks"
name = "gitleaks (staged secrets)"
language = "system"
entry = "mise exec -- scripts/record-check.sh hook:gitleaks -- mise exec -- gitleaks git --pre-commit --redact --staged --verbose --no-banner"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "shellcheck"
name = "ShellCheck"
language = "system"
entry = "mise exec -- scripts/record-check.sh hook:shellcheck -- shellcheck --severity=style"
files = '^scripts/.*\.sh$'

[[repos.hooks]]
id = "shfmt"
name = "shfmt (format check)"
language = "system"
entry = "mise exec -- scripts/record-check.sh hook:shfmt -- shfmt -d -i 4 -ci"
files = '^scripts/.*\.sh$'

[[repos.hooks]]
id = "gofumpt"
name = "gofumpt (format check)"
language = "system"
entry = "mise exec -- scripts/record-check.sh hook:gofumpt -- scripts/check-gofumpt.sh"
types = ["go"]

[[repos.hooks]]
id = "golangci-lint"
name = "golangci-lint run"
language = "system"
entry = "mise exec -- scripts/record-check.sh hook:golangci-lint -- golangci-lint run ./..."
types = ["go"]
pass_filenames = false

[[repos.hooks]]
id = "ruff"
name = "ruff check"
language = "system"
entry = "mise exec -- scripts/record-check.sh hook:ruff -- uv run ruff check --force-exclude"
types = ["python"]

[[repos.hooks]]
id = "ruff-format"
name = "ruff format --check"
language = "system"
entry = "mise exec -- scripts/record-check.sh hook:ruff-format -- uv run ruff format --check --force-exclude"
types = ["python"]

[[repos.hooks]]
id = "import-linter"
name = "import-linter contracts"
language = "system"
entry = "mise exec -- scripts/record-check.sh hook:import-linter -- uv run lint-imports --no-logo"
types = ["python"]
pass_filenames = false

[[repos.hooks]]
id = "pyrefly"
name = "pyrefly check"
language = "system"
entry = "mise exec -- scripts/record-check.sh hook:pyrefly -- uv run pyrefly check"
types = ["python"]
pass_filenames = false

[[repos.hooks]]
id = "biome"
name = "biome check"
language = "system"
entry = "mise exec -- scripts/record-check.sh hook:biome -- biome check --no-errors-on-unmatched"
files = '\.(js|mjs|cjs|jsx|ts|mts|cts|tsx|json|jsonc|css|html)$'

[[repos.hooks]]
id = "tombi-lint"
name = "tombi lint"
language = "system"
entry = "mise exec -- scripts/record-check.sh hook:tombi-lint -- tombi lint"
types = ["toml"]

[[repos.hooks]]
id = "tombi-format"
name = "tombi format --check"
language = "system"
entry = "mise exec -- scripts/record-check.sh hook:tombi-format -- tombi format --check"
types = ["toml"]

[[repos.hooks]]
id = "ryl"
name = "ryl check"
language = "system"
entry = "mise exec -- scripts/record-check.sh hook:ryl -- ryl check"
types = ["yaml"]

[[repos.hooks]]
id = "rumdl"
name = "rumdl check"
language = "system"
entry = "mise exec -- scripts/record-check.sh hook:rumdl -- rumdl check"
types = ["markdown"]

[[repos.hooks]]
id = "guard-markdown"
name = "guard-markdown"
language = "system"
entry = "mise exec -- scripts/record-check.sh hook:guard-markdown -- guard-markdown"
types = ["markdown"]

[[repos.hooks]]
id = "vale"
name = "vale (prose)"
language = "system"
entry = "mise exec -- scripts/record-check.sh hook:vale -- scripts/check-vale.sh"
types = ["markdown"]

[[repos.hooks]]
id = "mermaid"
name = "mermaid (fenced blocks)"
language = "system"
entry = "mise exec -- scripts/record-check.sh hook:mermaid -- scripts/check-mermaid.sh"
types = ["markdown"]

[[repos.hooks]]
id = "experiments"
name = "experiment directory layout"
language = "system"
entry = "mise exec -- scripts/record-check.sh hook:experiments -- scripts/check-experiments.sh"
files = "^experiments/"
pass_filenames = false

[[repos.hooks]]
id = "ignore-collisions"
name = "tracked path ignore and case collisions"
language = "system"
entry = "mise exec -- scripts/record-check.sh hook:ignore-collisions -- scripts/check-ignore-collisions.sh"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "commit-trailers"
name = "commit attribution and Refs trailers"
language = "system"
entry = "mise exec -- scripts/record-check.sh hook:commit-trailers -- scripts/check-pr-body.sh --commit-msg"
stages = ["commit-msg"]

[[repos.hooks]]
id = "vale-commit-msg"
name = "vale (commit message)"
language = "system"
entry = "mise exec -- scripts/record-check.sh hook:vale-commit-msg -- vale --ext=.md"
stages = ["commit-msg"]
