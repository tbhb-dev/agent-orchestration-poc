# Every tool is pinned to an exact version so local runs and CI resolve the same binaries.
# Move a pin deliberately and record the new version in the PR that moves it.
[tools]
go = "1.27.1"
gofumpt = "0.12.0"
golangci-lint = "2.14.0"
node = "24.21.0"
pnpm = "12.7.0"
python = "3.14.6"
rust = { version = "1.98.1", profile = "default" }
uv = "0.12.10"
gitleaks = "8.30.1"
prek = "0.5.1"
rumdl = "0.2.48"
tombi = "1.5.0"
vale = "3.22.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
shfmt = "3.14.0"
"aqua:quarto-dev/quarto-cli" = "1.10.18"
"npm:@biomejs/biome" = "2.5.14"
"pipx:ryl" = "0.22.0"
"pipx:jscpd" = "5.3.2"
"go:golang.org/x/tools/cmd/deadcode" = "0.50.0"
"go:github.com/tbhb/repotools/cmd/guard-markdown" = "0.9.0"
"go:github.com/go-gremlins/gremlins/cmd/gremlins" = "0.6.0"
"go:github.com/rillig/gobco" = "1.3.4"
"go:github.com/boyter/scc/v4" = "4.1.0"

[env]
# A go.mod toolchain mismatch fails instead of downloading a Go outside mise.
GOTOOLCHAIN = "local"
# uv otherwise prefers its own managed interpreters over the Python mise pins above.
UV_PYTHON_PREFERENCE = "only-system"

# Aggregates. `check` is what CI and workers run; `fmt` applies every formatter.
[tasks.check]
description = "Run every check and the tests"
depends = [
  "check:go",
  "check:shell",
  "check:ruff",
  "check:imports",
  "check:dupl",
  "check:deadcode",
  "check:pytest",
  "check:review-identity",
  "check:coverage",
  "check:pyrefly",
  "check:biome",
  "check:vale",
  "check:rumdl",
  "check:ryl",
  "check:tombi",
  "check:guard-markdown",
  "check:mermaid",
  "check:experiments",
  "check:ignore-collisions",
  "check:handoff-classifier",
  "check:secrets",
  "check:actions",
  "notebooks:lint",
  "check:workflow-forms",
  "check:gate-changes",
  "check:pr-size-contract",
]

[tasks.fmt]
description = "Apply every formatter"
depends = ["fmt:go", "fmt:shell", "fmt:ruff", "fmt:biome", "fmt:rumdl", "fmt:tombi"]

# Shell
[tasks."check:shell"]
description = "Lint and check formatting of repository shell scripts"
run = ["shellcheck --severity=style scripts/*.sh", "shfmt -d -i 4 -ci scripts/*.sh"]

[tasks."fmt:shell"]
description = "Format repository shell scripts"
run = "shfmt -w -i 4 -ci scripts/*.sh"

# Go
[tasks."check:go"]
description = "Format check, vet, module checks, lint, build, and test the Go module"
run = [
  "scripts/check-gofumpt.sh",
  "scripts/test-go-format.sh",
  "go vet ./...",
  "go mod tidy -diff",
  "go mod verify",
  "golangci-lint run ./...",
  "go build ./...",
  "go test -race -shuffle=on ./...",
]

[tasks."check:bus-relay"]
description = "Run the embedded relay security and lifecycle suite"
run = "go test -race -v ./internal/bus ./internal/core/relay ./internal/core/perms ./internal/core/layout"

[tasks."fmt:go"]
description = "Format Go with gofumpt"
run = "scripts/format-go.sh"

[tasks.build]
description = "Build bin/agentd and bin/agentctl, stamping VERSION (default dev) into the binaries"
run = [
  "go build -ldflags \"-X github.com/tbhb/agent-orchestration-poc/internal/version.Version=${VERSION:-dev}\" -o bin/agentd ./cmd/agentd",
  "go build -ldflags \"-X github.com/tbhb/agent-orchestration-poc/internal/version.Version=${VERSION:-dev}\" -o bin/agentctl ./cmd/agentctl",
]

# Python
[tasks."check:ruff"]
description = "Lint and check formatting of Python with ruff"
run = ["uv run ruff check .", "uv run ruff format --check ."]

[tasks."check:imports"]
description = "Check Python core and shell import contracts"
run = "uv run lint-imports --no-logo"

[tasks."check:dupl"]
description = "Fail on duplicated code in Go, Python, and TypeScript with jscpd"
run = "jscpd --config .jscpd.json --exit-code=1 cmd internal src tests experiments scripts apps packages"

[tasks."check:deadcode"]
description = "Fail on unreachable Go functions and unused Python names"
run = ["scripts/check-deadcode.sh", "uv run vulture"]

[tasks."fmt:ruff"]
description = "Fix and format Python with ruff"
run = ["uv run ruff check --fix .", "uv run ruff format ."]

[tasks."check:pytest"]
description = "Run the Python tests"
run = "uv run pytest"

[tasks."check:gate-changes"]
description = "Compare registered gates with the PR merge base and check reasons"
run = "uv run python -m agent_orchestration_poc.shell.gate_changes"

[tasks."check:skipscan"]
description = "Flag untracked skip indicators for #300 in pull request artifacts"
run = "uv run python -m agent_orchestration_poc.shell.skipscan"

[tasks."monitor:project-probe"]
description = "Read-only Project 9 source and event feasibility probe"
run = "uv run python scaffolding/github-monitor/project_probe.py"

[tasks."monitor:test-project-probe"]
description = "Test the disposable Project 9 probe"
run = "uv run pytest tests/test_project_probe.py"

[tasks."monitor:repair"]
description = "Repair explicitly tracked temporary monitor objects through REST"
run = "uv run python scaffolding/github-monitor/rest_client.py"

[tasks."monitor:test-repair"]
description = "Test fixture-backed temporary REST repair"
run = "PYTHONPATH=scaffolding/github-monitor uv run pytest scaffolding/github-monitor/tests/test_repair.py"

[tasks."check:review-identity"]
description = "Run reviewer policy and wrapper process fixtures"
run = "uv run pytest tests/fixtures/review_identity/test_policy.py tests/fixtures/review_identity/test_wrapper.py --run-integration"

[tasks."check:coverage"]
description = "Gate Python lines and branches and Go statements and branches"
run = [
  "mkdir -p .coverage-reports",
  "uv run --group analysis pytest --run-integration --cov=agent_orchestration_poc --cov-report=json:.coverage-reports/python.json --cov-report=term",
  "go test -tags=integration -coverprofile=.coverage-reports/go.out ./...",
  "uv run python scripts/check-coverage.py",
]

[tasks."check:pyrefly"]
description = "Type check Python with pyrefly in strict mode"
env = { PYTHONPATH = "scaffolding/worker-messaging" }
run = "uv run pyrefly check --search-path scaffolding/github-monitor"

[tasks."check:mutation"]
description = "Run the Go and Python core mutation score gates"
run = ["mise run check:mutation:go", "mise run check:mutation:python"]

[tasks."check:mutation:go"]
description = "Mutation test the Go core with gremlins"
env = { RAPID_NOFAILFILE = "1", RAPID_SHRINKTIME = "1s" }
run = [
  "rm -f gremlins.json",
  "gremlins unleash ./internal/core --output-statuses lct --output gremlins.json",
  "uv run python scripts/check-gremlins-output.py",
]

[tasks."check:mutation:python"]
description = "Check Python core mutation score"
run = "uv run python scripts/check-mutation-score.py"

[tasks."check:property:nightly:go"]
description = "Run Go core properties with the nightly random seed"
run = "go test -race -shuffle=on ./internal/core/..."

[tasks."check:property:nightly:python"]
description = "Run Python tests with the nightly random seed"
run = 'uv run pytest --hypothesis-profile=default --hypothesis-seed="$HYPOTHESIS_SEED"'

# JavaScript, TypeScript, CSS, JSON, HTML
[tasks."check:biome"]
description = "Lint and check formatting with Biome"
run = "biome check --no-errors-on-unmatched ."

[tasks."fmt:biome"]
description = "Fix and format with Biome"
run = "biome check --write --no-errors-on-unmatched ."

# Prose
[tasks."vale:sync"]
description = "Download the pinned Vale styles into .vale/styles"
run = "vale sync"

[tasks."check:vale"]
description = "Lint prose with Vale (ai-tells)"
run = "scripts/check-vale.sh"

[tasks."check:rumdl"]
description = "Lint Markdown with rumdl"
run = "rumdl check ."

[tasks."fmt:rumdl"]
description = "Fix Markdown with rumdl"
run = "rumdl fmt ."

[tasks."check:guard-markdown"]
description = "Check that no Markdown paragraph is hard-wrapped"
run = "scripts/markdown-files.sh | xargs -r guard-markdown"

[tasks."check:mermaid"]
description = "Parse every fenced mermaid block"
run = "scripts/check-mermaid.sh"

# YAML and TOML
[tasks."check:ryl"]
description = "Lint YAML with ryl"
run = "ryl check ."

[tasks."check:tombi"]
description = "Lint and check formatting of TOML with tombi"
run = ["tombi lint", "tombi format --check"]

[tasks."fmt:tombi"]
description = "Format TOML with tombi"
run = "tombi format"

# Repository rules
[tasks."check:experiments"]
description = "Check that every experiment directory has README.md, evidence/, and versions.md"
run = "scripts/check-experiments.sh"

[tasks."check:ignore-collisions"]
description = "Fail on ignored tracked paths and warn about case-folded directory matches"
run = ["scripts/check-ignore-collisions.sh", "scripts/test-ignore-collisions.sh"]

[tasks."check:handoff"]
description = "Verify PRs described as open in the handoff are open on GitHub"
run = "scripts/check-handoff-prs.sh"

[tasks."check:handoff-classifier"]
description = "Test open PR classification with handoff line fixtures"
run = "scripts/test-handoff-pr-classifier.sh"

[tasks."check:secrets"]
description = "Scan the git history for secrets with gitleaks"
run = "gitleaks git --redact --no-banner ."

[tasks."check:actions"]
description = "Lint the GitHub Actions workflows with actionlint"
run = "actionlint"

# Analysis notebooks. The shell selects the locked interpreter for Quarto.
[tasks."notebooks:lint"]
description = "Lint prose, Python cells, and privacy in committed Quarto notebooks"
run = "uv run --group analysis python -m agent_orchestration_poc.shell.analysis.notebooks lint"

[tasks."notebooks:render"]
description = "Execute one Quarto notebook from source without cache"
run = "uv run --group analysis python -m agent_orchestration_poc.shell.analysis.notebooks render"

[tasks."notebooks:verify"]
description = "Lint and execute one Quarto notebook from source"
run = "uv run --group analysis python -m agent_orchestration_poc.shell.analysis.notebooks verify"

[tasks."notebooks:ci"]
description = "Render every notebook with committed or synthetic inputs"
run = "uv run --group analysis python -m agent_orchestration_poc.shell.analysis.notebooks ci"

# Temporary local GitHub monitor for issue #167.
[tasks."monitor:start"]
run = "uv run python scaffolding/github-monitor/cli.py start"

[tasks."monitor:status"]
run = "uv run python scaffolding/github-monitor/cli.py status"

[tasks."monitor:track"]
run = "uv run python scaffolding/github-monitor/cli.py track"

[tasks."monitor:test-receiver"]
run = "PYTHONPATH=scaffolding/github-monitor uv run pytest scaffolding/github-monitor/tests"

# Coordinator preflight. These read live GitHub or git state and run separately from `check`.
[tasks."review:preflight"]
description = "Check that a PR branch includes current main workflows: mise run review:preflight -- <pr>"
run = "uv run python -m agent_orchestration_poc.shell.coordinator_preflight review"

[tasks."pr:wait-check"]
description = "Wait for a named check on the current PR head: mise run pr:wait-check -- <pr> <name> <timeout-seconds>"
run = "uv run python -m agent_orchestration_poc.shell.coordinator_preflight wait-check"

[tasks."checkpoint:closure-audit"]
description = "Audit closed work-item issues for linked merged PRs or recorded non-code closure"
run = "uv run python -m agent_orchestration_poc.shell.coordinator_preflight closure-audit"

# Pull request checks. These need a PR title, body, or base ref, so they run in CI (see .github/workflows/)
# and by hand, never as part of the `check` aggregate.
[tasks."check:pr-body"]
description = "Check a PR body on stdin against the commit convention: mise run check:pr-body -- '<title>' < body.md"
run = "scripts/check-pr-body.sh"

[tasks."check:workflow-forms"]
description = "Test workflow form decisions and compare generated forms"
run = ["uv run pytest tests/test_workflow_forms.py", "uv run python -m agent_orchestration_poc.shell.workflow_forms forms"]

[tasks."forms:write"]
description = "Regenerate issue forms from the workflow reference"
run = "uv run python -m agent_orchestration_poc.shell.workflow_forms write-forms"

[tasks."workflow:issue"]
description = "Read and validate one issue"
run = "uv run python -m agent_orchestration_poc.shell.workflow_forms issue"

[tasks."workflow:issues"]
description = "Read and validate every open issue"
run = "uv run python -m agent_orchestration_poc.shell.workflow_forms issues"

[tasks."workflow:pr"]
description = "Read and validate one pull request"
run = "uv run python -m agent_orchestration_poc.shell.workflow_forms pr"

[tasks."scc:version"]
description = "Report the pinned scc version for the PR size contract"
run = "scc --version"

[tasks."check:pr-size-contract"]
description = "Verify the PR size counter and print every fixture result"
run = "uv run pytest tests/test_pr_size.py --run-integration -s"

[tasks."pr:size"]
description = "Emit per-file PR size JSON against a target branch"
run = "uv run python -m agent_orchestration_poc.shell.pr_size"

[tasks."check:imported-research"]
description = "Check that research/imported/ is unchanged against a base ref: mise run check:imported-research -- <base> '<title>'"
run = "scripts/check-imported-research.sh"

# Docs site (Astro Starlight in docs/). Not part of `check`; CI runs a separate docs job.
[tasks."docs:install"]
description = "Install the docs site dependencies from the committed lockfile"
dir = "docs"
run = "pnpm install --frozen-lockfile"

[tasks."docs:browsers"]
description = "Install the Playwright Chromium that rehype-mermaid renders diagrams with"
dir = "docs"
run = "pnpm exec playwright install --with-deps chromium"

[tasks."docs:dev"]
description = "Serve the docs site with live reload"
dir = "docs"
depends = ["docs:install"]
run = "pnpm exec astro dev"

[tasks."docs:build"]
description = "Build the docs site into docs/dist"
dir = "docs"
depends = ["docs:install"]
run = "pnpm exec astro build"

[tasks."docs:check-links"]
description = "Build the docs site with starlight-links-validator enabled"
dir = "docs"
depends = ["docs:install"]
env = { CHECK_LINKS = "1" }
run = "pnpm exec astro build"

[tasks."worker:launch"]
description = "Launch a temporary interactive worker for issue 176"
run = "uv run python scaffolding/worker-messaging/cli.py launch"

[tasks."worker:status"]
description = "Recheck a temporary worker run"
run = "uv run python scaffolding/worker-messaging/cli.py status"

[tasks."worker:readiness"]
description = "Recheck temporary worker readiness"
run = "uv run python scaffolding/worker-messaging/cli.py readiness"

[tasks."worker:cleanup"]
description = "Remove a temporary worker run's exact Codex folder trust"
run = "uv run python scaffolding/worker-messaging/cli.py cleanup"

[tasks."worker:test-launcher"]
description = "Test temporary worker launch decisions"
env = { PYTHONPATH = "scaffolding/worker-messaging" }
run = "uv run pytest scaffolding/worker-messaging/tests"
